# Configuración del servidor de los asistentes en Cloudflare Workers
name = "lavanda-asistente"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Activa la dirección pública https://lavanda-asistente.bardoujuanjose.workers.dev
workers_dev = true

# Guarda los registros del servidor (errores, avisos) para poder revisarlos
[observability]
enabled = true

# Memoria de cada cliente de WhatsApp (una por número de teléfono)
[[durable_objects.bindings]]
name = "CONVERSACIONES"
class_name = "Conversacion"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversacion"]

# Fichas de las lavanderías dadas de alta en el panel /admin (una sola instancia)
[[durable_objects.bindings]]
name = "REGISTRO"
class_name = "Registro"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registro"]

# Transcripción de audios de WhatsApp (Workers AI, plan gratuito)
[ai]
binding = "AI"

# Ajustes no secretos
[vars]
GRAPH_VERSION = "v23.0"
# Cuenta de WhatsApp Business de Lavanda (no es secreto)
WHATSAPP_WABA_ID = "1781568759662157"
OWNER_TEMPLATE = "aviso_lavanda"
# Voz del asistente telefónico (Twilio ConversationRelay)
VOZ_IDIOMA = "es-ES"
VOZ_TTS_PROVIDER = "ElevenLabs"
# Voz elegida en ElevenLabs: "VoiceID-modelo-velocidad_estabilidad_similitud" (velocidad 0.9)
VOZ_VOZ = "2BJPFS2QZRUEpfkbclGy-flash_v2_5-0.9_0.5_0.75"
OWNER_TEMPLATE_LANG = "es"
# App de Meta para que cada lavandería conecte su WhatsApp ("registro integrado", página /alta/…).
# META_APP_ID: arriba del todo en el panel de la app de Meta. META_CONFIG_ID: Facebook Login for Business →
# Configurations (plantilla "WhatsApp Embedded Signup"). No son secretos. Descoméntalas al tenerlas:
# META_APP_ID = ""
# META_CONFIG_ID = ""

# SECRETOS: NO van aquí. Se guardan en Cloudflare
# (Settings → Variables and Secrets → Runtime → tipo Secret):
#   ANTHROPIC_API_KEY      clave de Claude
#   WHATSAPP_TOKEN         token permanente de la app de Meta
#   WHATSAPP_PHONE_ID      identificador del número de WhatsApp en Meta
#   WHATSAPP_APP_SECRET    "App secret" de la app de Meta
#   WHATSAPP_VERIFY_TOKEN  palabra secreta que inventas para conectar Meta
#   OWNER_PHONE            tu móvil personal (donde recibes los avisos)
#   ADMIN_CLAVE            contraseña del panel /admin
#   CLAVE_CIFRADO          clave (mínimo 16 caracteres) para cifrar los tokens de WhatsApp de cada lavandería.
#                          Si se cambia, los tokens guardados dejan de poder leerse.

# Archivos públicos (frases grabadas con la voz del asistente), en https://…/audio/…
[assets]
directory = "./publico"
